name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -r pretraining/requirements-test.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify independent reproduction bundle
        run: python pretraining/reproducibility/recompute.py
      - name: Replay paired confidence intervals
        run: python pretraining/reproducibility/recompute_efficiency_ci.py
      - name: Verify repository layout and published results
        run: python tools/verify_repository.py
      - name: Verify language-model comparison and README
        run: python tools/build_language_showcase.py --check
      - name: Verify math and code post-training verdicts
        run: python posttraining/2026-10-20-video-model/verify_results.py
      - name: Run tests
        run: python -m pytest -q
