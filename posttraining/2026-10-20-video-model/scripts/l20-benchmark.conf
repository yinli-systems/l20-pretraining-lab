[program:l20-benchmark]
command=/bin/bash /workspace/posttrain-l20/benchmark.sh
directory=/workspace/posttrain-l20
autostart=false
autorestart=false
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/posttrain-l20/logs/benchmark.log
redirect_stderr=true
stdout_logfile_maxbytes=20971520
stdout_logfile_backups=1
