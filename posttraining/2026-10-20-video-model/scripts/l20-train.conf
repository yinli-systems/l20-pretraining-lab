[program:l20-train]
command=/bin/bash /workspace/posttrain-l20/pipeline.sh
directory=/workspace/posttrain-l20
autostart=false
autorestart=false
startsecs=3
stopwaitsecs=120
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/posttrain-l20/logs/pipeline.log
redirect_stderr=true
stdout_logfile_maxbytes=20971520
stdout_logfile_backups=1
