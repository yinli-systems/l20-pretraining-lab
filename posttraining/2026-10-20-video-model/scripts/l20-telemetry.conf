[program:l20-telemetry]
command=/bin/bash /workspace/posttrain-l20/telemetry.sh
directory=/workspace/posttrain-l20
autostart=false
autorestart=false
startsecs=2
stopasgroup=true
killasgroup=true
stdout_logfile=/workspace/posttrain-l20/logs/telemetry.log
redirect_stderr=true
stdout_logfile_maxbytes=1048576
